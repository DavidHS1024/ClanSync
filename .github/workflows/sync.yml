name: ClanSync Automator

on:
  schedule:
    # Viernes: Desde las 06:00 UTC (01:00 AM Perú) hasta el final del día UTC
    - cron: '0 6-23 * * 5'
    
    # Sábados y Domingos: Las 24 horas (00:00 a 23:00 UTC)
    - cron: '0 * * * 6,0'
    
    # Lunes: Desde las 00:00 UTC hasta las 08:00 UTC (03:00 AM Perú). 
    # Esta última ejecución a las 3 AM garantiza capturar los resultados finales post-evento.
    - cron: '0 0-8 * * 1'
    
  workflow_dispatch:

jobs:
  update-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests gspread oauth2client python-dotenv

      - name: Ejecutar ClanSync
        env:
          COC_TOKEN: ${{ secrets.COC_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CLAN_TAG: ${{ secrets.CLAN_TAG }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python main.py