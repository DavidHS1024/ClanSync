name: ClanSync Automator

on:
  schedule:
    # Viernes: Cada 30 minutos desde las 06:00 UTC
    - cron: '*/30 6-23 * * 5'
    
    # Sábados y Domingos: Cada 30 minutos todo el día
    - cron: '*/30 * * * 6,0'
    
    # Lunes: Cada 30 minutos hasta las 08:00 UTC
    - cron: '*/30 0-8 * * 1'
    
  workflow_dispatch:

jobs:
  update-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests gspread oauth2client python-dotenv

      - name: Ejecutar ClanSync
        env:
          COC_TOKEN: ${{ secrets.COC_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CLAN_TAG: ${{ secrets.CLAN_TAG }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python main.py